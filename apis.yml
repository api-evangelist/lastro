aid: lastro
name: Lastro
description: 'Lastro is a Brazilian proptech company building artificial intelligence for the real estate
  market. Its product, Lais (lais.ai), is a generative-AI platform for real estate agencies that engages
  and qualifies inbound leads over WhatsApp and other channels, then follows the customer journey from
  first contact through to a closed deal — covering property listing and management, marketing and lead
  generation, pre-qualification, visit scheduling, administrative service and strategic reporting. Human
  agents and the AI work the same queue inside Casa da Lais, the operator dashboard. Lastro reports more
  than 1,000 real estate agency customers, over 5 million people served and more than R$ 12 billion in
  sales volume (VGV) managed in Brazil. The company is backed by Prosus Ventures and QED Investors.
  Lastro publishes no public developer API; the only programmatic surface found is the Wix
  platform-provisioned site MCP endpoint on lastro.co.'
